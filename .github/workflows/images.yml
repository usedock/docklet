name: images

# Dockyard: builds the catalog images in images/catalog.toml for amd64 (on
# ubuntu-latest) and arm64 (on the native ubuntu-24.04-arm runner), boot-tests
# each one under QEMU (KVM when the runner exposes /dev/kvm, else TCG),
# and on an images-* tag signs the files with cosign (keyless,
# identity = this workflow at the tag) and publishes them as a release that is
# never marked latest, so CLI releases stay latest. Pull requests that touch
# images/ build and boot-test only.

on:
  push:
    tags: ['images-*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'images/**'
      - 'internal/dockyard/**'
      - 'cmd/dockyard-index/**'
      - 'cmd/gen-fast-agent/**'
      - '.github/workflows/images.yml'

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # arm64 boot tests fall back to TCG emulation when the runner has no KVM.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Add an image: add it to images/catalog.toml and list it here.
        image: [ubuntu-24.04, node-22, python-3.12, browser]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap zstd qemu-system-x86 qemu-system-arm e2fsprogs
          ls -l /dev/kvm || echo "no /dev/kvm: boot test runs under TCG"
      - name: build
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: sudo env "PATH=$PATH" bash images/build.sh "$IMAGE" "$ARCH" "$PWD/dist"
      - name: boot test
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          sudo chmod 666 /dev/kvm || true
          bash images/boot-test.sh "$IMAGE" "$ARCH" "$PWD/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.image }}-${{ matrix.arch }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/images-')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: image-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: v2.4.1
      - name: index
        env:
          TAG: ${{ github.ref_name }}
        run: |
          go run ./cmd/dockyard-index -catalog images/catalog.toml -dir dist -version "$TAG" \
            -base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat dist/dockyard.json
      - name: checksums
        working-directory: dist
        run: |
          sha256sum -- * > ../checksums.txt
          mv ../checksums.txt checksums.txt
          cat checksums.txt
      - name: sign
        working-directory: dist
        run: |
          for f in *; do
            case "$f" in *.bundle) continue ;; esac
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag --latest=false
