name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -timeout 8m ./...
      - name: version ldflag
        run: |
          go build -ldflags "-X main.version=v0.0.0-ci" -o "$RUNNER_TEMP/docklet" ./cmd/docklet
          test "$("$RUNNER_TEMP/docklet" --version)" = v0.0.0-ci
      - name: shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: verify tests
        run: bash scripts/test-verify.sh
      - name: install script tests
        run: bash scripts/test-install.sh
      - name: dock version ldflag
        run: |
          go build -ldflags "-X main.version=v0.0.0-ci" -o "$RUNNER_TEMP/dock" ./cmd/dock
          test "$("$RUNNER_TEMP/dock" version)" = v0.0.0-ci
      - name: powershell parse check
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Error "$($f.Name): $($_.Message)" }; exit 1 }
            Write-Host "parsed $($f.Name)"
          }
      - name: install.ps1 smoke test
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact

  # The dock CLI and its local engine are portable: build and unit-test them where users run them.
  cli-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: build dock
        run: go build ./cmd/dock
      - name: test
        run: go test -timeout 8m ./internal/local/... ./internal/guestagent/... ./internal/cli/...

  # Boots a real local dock with KVM. It skips itself until a Dockyard index with the default image is published.
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: install qemu
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
      - name: allow /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm; the e2e test will skip"
      - name: e2e
        run: go test -tags e2e -run TestE2ELocalDock -v -timeout 25m ./internal/local/
