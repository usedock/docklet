name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        env:
          DOCK_REQUIRE_E2FSPROGS: "1"
        run: go test -timeout 8m ./...
      - name: real e2fsprogs (debugfs script)
        env:
          DOCK_REQUIRE_E2FSPROGS: "1"
        run: go test -count=1 -v -run 'TestDebugfs' ./internal/local/
      - name: version ldflag
        run: |
          go build -ldflags "-X main.version=v0.0.0-ci" -o "$RUNNER_TEMP/docklet" ./cmd/docklet
          test "$("$RUNNER_TEMP/docklet" --version)" = v0.0.0-ci
      - name: shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: verify tests
        run: bash scripts/test-verify.sh
      - name: install script tests
        run: bash scripts/test-install.sh
      - name: dock version ldflag
        run: |
          go build -ldflags "-X main.version=v0.0.0-ci" -o "$RUNNER_TEMP/dock" ./cmd/dock
          test "$("$RUNNER_TEMP/dock" version)" = v0.0.0-ci
      - name: powershell parse check
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Error "$($f.Name): $($_.Message)" }; exit 1 }
            Write-Host "parsed $($f.Name)"
          }
      - name: install.ps1 smoke test
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact

  # The dock CLI and its local engine are portable: build and unit-test them where users run them.
  cli-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: build dock
        run: go build ./cmd/dock
      - name: test
        run: go test -timeout 8m ./internal/local/... ./internal/guestagent/... ./internal/cli/...

  # Runs a real local gVisor dock (Docker + runsc, no KVM needed) through the engine.
  e2e-local-gvisor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: install runsc
        run: |
          set -eux
          # Same pinned release and sha256 as the fleet hosts; the bucket's latest/ layout changes.
          eval "$(grep -E '^RUNSC_(VERSION|SHA256_X86_64)=' scripts/bootstrap-host.sh)"
          tmp=$(mktemp -d)
          curl -fsSL -o "${tmp}/gvisor.tar.bz2" "https://github.com/google/gvisor/releases/download/${RUNSC_VERSION}/gvisor-x86_64.tar.bz2"
          echo "${RUNSC_SHA256_X86_64}  ${tmp}/gvisor.tar.bz2" | sha256sum -c -
          tar -xjf "${tmp}/gvisor.tar.bz2" -C "${tmp}" runsc
          sudo install -m 0755 "${tmp}/runsc" /usr/local/bin/runsc
          sudo /usr/local/bin/runsc install
          # Separate runtime so docks get sudo (--allow-suid) and a rootfs that survives stop (--overlay2=none); plain runsc stays the default.
          sudo /usr/local/bin/runsc install --runtime=runsc-suid -- --allow-suid --overlay2=none
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
      - name: gvisor engine e2e
        env:
          DOCK_E2E_REQUIRE_GVISOR: "1"
          DOCK_REQUIRE_E2FSPROGS: "1"
        run: go test -tags e2e -run TestE2ELocalGVisor -v -timeout 35m ./internal/local/
      - name: fleet work export e2e (runsc dock, host tar as root)
        env:
          DOCK_E2E_REQUIRE_GVISOR: "1"
        run: |
          go test -tags e2e -c -o "$RUNNER_TEMP/host.test" ./internal/host/
          cd internal/host && sudo -E "$RUNNER_TEMP/host.test" -test.run TestE2EWorkExport -test.v -test.timeout 10m

  # Boots real local docks with KVM from the pinned Dockyard release, through the dock CLI and the engine.
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: v2.4.1
      - name: install qemu
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
      - name: allow /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: verify the pinned dockyard.json
        run: bash scripts/e2e-verify-index.sh
      - name: build dock
        run: go build -o "$RUNNER_TEMP/dock" ./cmd/dock
      - name: dock CLI end to end
        env:
          DOCK: ${{ runner.temp }}/dock
          DOCK_DATA_DIR: ${{ runner.temp }}/dockdata
          DOCK_E2E_GATEWAY_BLOCK: "1"
        run: bash scripts/e2e-local.sh
      - name: engine e2e
        env:
          DOCK_E2E_REQUIRE: "1"
        run: go test -tags e2e -run TestE2ELocalDock -v -timeout 25m ./internal/local/
      - name: guest logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/dockdata/docks/*/serial.log "$RUNNER_TEMP"/dockdata/docks/*/qemu.log; do
            [ -f "$f" ] && { echo "=== $f"; tail -80 "$f"; }
          done || true
