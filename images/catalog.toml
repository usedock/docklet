# Dockyard: official dock images built by .github/workflows/images.yml.
# An image with no base is debootstrapped; one with a base runs its setup
# script on top of that image's rootfs. No coding agents are installed.

[[image]]
name = "ubuntu-24.04"
description = "Minimal Ubuntu 24.04: systemd, openssh-server, Docker, git, curl, python3"
size_mib = 2048
arch = ["amd64"]

[[image]]
name = "node-22"
description = "ubuntu-24.04 with Node.js 22"
base = "ubuntu-24.04"
setup = "setup-node-22.sh"
size_mib = 2560
arch = ["amd64"]

[[image]]
name = "python-3.12"
description = "ubuntu-24.04 with Python 3.12, pip and venv"
base = "ubuntu-24.04"
setup = "setup-python-3.12.sh"
size_mib = 2560
arch = ["amd64"]

[[image]]
name = "browser"
description = "ubuntu-24.04 with Chromium and its dependencies"
base = "ubuntu-24.04"
setup = "setup-browser.sh"
size_mib = 3584
arch = ["amd64"]
